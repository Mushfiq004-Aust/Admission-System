server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # config.js holds the backend URL and must never be cached.
  location = /config.js {
    add_header Cache-Control "no-store";
  }

  # Single-page app: any unknown path (e.g. a refreshed /my-applications) falls back to index.html.
  location / {
    try_files $uri /index.html;
  }
}
